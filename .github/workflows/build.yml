name: Build

on:
  push:
    branches:
      - "*"
    paths-ignore:
      - "README.md"
      - "COPYING"
      - "COPYING.LESSER"
      - ".gitignore"
      - "Update Notes"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: gradle
      - name: Build for Minecraft 26.1.2
        run: chmod +x ./gradlew && ./gradlew build -Pmc=26.1.2 --no-daemon
      - name: Build for Minecraft 26.2
        run: ./gradlew build -Pmc=26.2 --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Better PV
          path: build/libs/*.jar
